# Agentic PMS — per-client Render blueprint (dev/reference; client prod may
# be their own cloud per deploy-and-transfer). One instance = one tenant.
#
# TESTING/POC CONFIG: both the api service and the database are pinned to
# Render's free plan below. Two real, known limitations of that tier —
# not bugs in this app — worth knowing before UAT:
#   1. Free web services sleep after 15 minutes idle, waking on the next
#      request (30-60s cold start). The daily Quarterly Connect reminder
#      check (server/index.js's setInterval, wired to BR-4.4) won't fire
#      reliably while asleep — it only runs at boot and once every 24h
#      while the process happens to be awake. For testing THAT specific
#      feature, trigger it on demand instead: POST /pms/connects/check-
#      reminders (HR-only) runs the same check immediately, asleep or not.
#   2. Free Postgres databases expire 30 days after creation. Fine for a
#      testing window; must be upgraded (or recreated) before that, or
#      before any real production use, or the data is gone.
# Before going to real production: remove both `plan: free` lines below
# (or set an explicit paid plan) so the app is always-on and the database
# is durable — no code changes needed either way, this is purely an
# infrastructure-tier choice.
services:
  - type: web
    name: agentic-pms-api
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      # fromDatabase auto-links this to the agentic-pms-db resource
      # created by the SAME blueprint — Render fills in the real
      # connection string itself the moment the database exists. This
      # value literally cannot be known ahead of time (Render assigns the
      # internal hostname dynamically), so it must never be a manual
      # "enter value" field — that was a mistake in an earlier version of
      # this file.
      - key: DATABASE_URL
        fromDatabase:
          name: agentic-pms-db
          property: connectionString
      # generateValue lets Render generate and store a cryptographically
      # random secret itself at deploy time — safer than asking a human
      # to type one into a browser field, and one less secret anyone
      # needs to remember or lose.
      - key: JWT_SECRET
        generateValue: true
      - key: TENANT_SLUG
        value: CHANGE_ME
      - key: AUTH_DEV
        value: "false"       # "true" only on dev instances
  - type: web
    name: agentic-pms-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Injected at BUILD time (Vite bakes env vars into the static bundle
      # at build, not runtime) — the api service's Render host, so
      # production API calls go to the real backend domain instead of a
      # relative path that would hit this static site's own domain. See
      # frontend/src/utils/api.jsx's API_BASE for the client-side half of
      # this. Local dev needs no equivalent — vite.config.js's dev-server
      # proxy handles relative /api paths during `npm run dev`.
      - key: VITE_API_URL
        fromService:
          type: web
          name: agentic-pms-api
          property: host
databases:
  - name: agentic-pms-db
    plan: free
